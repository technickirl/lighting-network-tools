name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: gofmt
        run: |
          out=$(gofmt -l .)
          if [ -n "$out" ]; then echo "Not gofmt-formatted:"; echo "$out"; exit 1; fi
      - name: vet
        run: go vet ./...
      - name: test
        run: go test ./...
      - name: test the numbering planner
        run: node internal/commission/combo_test.js
      - name: build (linux)
        run: go build ./...
      - name: build (mac arm64, mac x64, windows x64, pi)
        env:
          CGO_ENABLED: "0"
        run: |
          set -e
          GOOS=darwin  GOARCH=arm64 go build -o /dev/null ./luminex-commission-go
          GOOS=darwin  GOARCH=amd64 go build -o /dev/null ./luminex-commission-go
          GOOS=windows GOARCH=amd64 go build -o /dev/null ./luminex-commission-go
          GOOS=linux GOARCH=arm GOARM=6 go build -o /dev/null ./luminex-commission-go
          GOOS=linux GOARCH=arm64       go build -o /dev/null ./luminex-commission-go
